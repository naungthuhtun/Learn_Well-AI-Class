<!doctype html>
<html lang="my">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnWell — AI Video Class</title>
  <style>
:root{
  --bg:#11110f; --panel:#1b1b18; --panel2:#22221e; --line:#3b3932;
  --gold:#eab16e; --gold2:#f3c58e; --text:#f5f1e9; --muted:#aaa49a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Myanmar",sans-serif;line-height:1.8}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.wrap{max-width:1400px;margin:auto;padding:16px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;position:sticky;top:0;z-index:30;
  background:rgba(17,17,15,.92);backdrop-filter:blur(8px);padding:10px 0}
.brand{font-size:23px;font-weight:900;color:var(--gold);white-space:nowrap}
.search{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:25px;padding:10px 16px;color:#fff;outline:none;min-width:120px}
.search:focus{border-color:var(--gold)}
.btn{display:inline-block;background:#2b2923;color:#fff;border:1px solid #514a3d;padding:9px 14px;border-radius:9px;transition:.15s}
.btn:hover{background:#37342c}
.gold{background:var(--gold);color:#24190f;border:0;font-weight:bold}
.gold:hover{background:#f0be83}

/* ---------- hero ---------- */
.hero{background:linear-gradient(110deg,#80542f,#493321 65%,#30271e);border-radius:20px;padding:26px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
.hero h1{font-size:clamp(24px,4vw,36px);line-height:1.45;margin:8px 0}
.hero p{font-size:13px;color:#f1dfca;max-width:560px}
.hero small{color:#ffd9a8}
.hero-cards{display:flex;gap:10px}
.skill{background:#fff8ed;color:#29231c;width:110px;height:140px;padding:12px;border-radius:12px;
  display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
.skill:hover{transform:translateY(-4px)}
.skill:nth-child(2){background:#efbd88}
.skill b{font-size:14px;line-height:1.4}
.skill span{text-align:right;font-size:32px}

/* ---------- progress ---------- */
.progress{margin:15px 0;background:#1c1c19;border:1px solid #393832;border-radius:12px;padding:12px 16px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:#ccc4b8}
.bar{height:7px;background:#3b3932;border-radius:20px;margin-top:8px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#e8ad68,#f7d6a6);transition:width .5s}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:270px 1fr;gap:17px;align-items:start}
.side,.main{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.side{padding:14px;position:sticky;top:70px}
.side-brand{color:var(--gold);font-weight:bold;font-size:18px;margin:4px 8px 14px}
.side-title{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px;color:#d8d1c6}
.lesson-list{display:grid;gap:5px;max-height:56vh;overflow:auto;padding-right:2px}
.lesson-list::-webkit-scrollbar{width:6px}
.lesson-list::-webkit-scrollbar-thumb{background:#3b3932;border-radius:5px}
.lesson-btn{display:flex;align-items:center;gap:9px;text-align:left;background:transparent;color:#fff;
  border:1px solid transparent;border-radius:9px;padding:8px;width:100%;transition:.15s}
.lesson-btn:hover{background:#292822}
.lesson-btn.active{background:#393026;border-color:#795c3a}
.lesson-btn.locked{opacity:.4;cursor:not-allowed}
.num{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;background:#36342e;
  border-radius:8px;color:#eab779;font-size:12px;font-weight:bold}
.lesson-btn.done .num{background:#28543e;color:#a8efc7}
.lesson-btn strong{font-size:11.5px;display:block;line-height:1.5}
.lesson-btn small{font-size:10px;color:#aaa49a}
.note{font-size:11px;color:#aaa49a;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}

.main{padding:22px;min-height:600px}
.empty{text-align:center;padding:60px 10px}
.empty h2{margin:8px 0}
.empty p{color:var(--muted);font-size:14px}

/* ---------- lesson content ---------- */
.back{font-size:13px;margin-bottom:16px}
.tag{display:inline-block;background:#382f24;color:#edbb81;border-radius:20px;padding:4px 12px;font-size:11px}
h2{font-size:23px;line-height:1.5;margin:10px 0 3px}
.meta{font-size:11px;color:var(--muted);letter-spacing:.5px}
.cover{margin:17px 0;background:linear-gradient(120deg,#694729,#28231d);border-radius:14px;min-height:130px;
  display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:14px}
.cover span{font-size:60px}
.cover b{font-size:18px;line-height:1.5;letter-spacing:1px}
.intro{background:#26241f;border:1px solid #403b31;padding:15px;border-radius:12px;font-size:14px;margin:16px 0}
.section{margin:24px 0}
.section h3{font-size:16px;color:#efbd83;margin:0 0 10px}
.section p,.section li{font-size:14px;color:#e0d9cf}
.section li{margin:7px 0}
.tip{background:#202b24;border:1px solid #3b5847;padding:13px;border-radius:11px;font-size:13px;margin:15px 0}
.prompt{background:#11110f;border:1px solid #514535;padding:15px;border-radius:11px;white-space:pre-wrap;
  font-size:13px;color:#f0d7b5;overflow-wrap:anywhere;font-family:"Courier New",monospace;line-height:1.7}
.copyrow{text-align:right;margin-top:8px}
.copy{background:#393026;color:#f3c58e;border:0;padding:7px 13px;border-radius:8px;font-size:12px}
.copy:hover{background:#4a3d2d}
.task{background:#26241f;border:1px dashed #826644;padding:15px;border-radius:11px;font-size:13px}
.task label{display:flex;gap:10px;margin-top:12px;align-items:flex-start;cursor:pointer}
.task input{width:18px;height:18px;accent-color:var(--gold);margin-top:3px;flex-shrink:0}
.video{margin:18px 0;background:#11110f;border:1px solid #403b31;border-radius:12px;padding:14px}
.video h3{font-size:15px;color:#efbd83;margin:0 0 10px}
.video iframe,.video video{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;display:block;margin-bottom:10px}
.video a{color:#efbd83}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.gallery img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;border:1px solid #403b31;cursor:zoom-in;transition:.2s}
.gallery img:hover{transform:scale(1.03);border-color:var(--gold)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.nav .btn{min-width:130px;text-align:center}

/* ---------- admin ---------- */
.admin-card{background:#1f1f1b;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.admin-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.admin-head b{font-size:14px}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field textarea,.field input[type=password]{width:100%;padding:10px 12px;background:#111;
  color:#fff;border:1px solid #555;border-radius:8px;outline:none}
.field textarea{min-height:70px;resize:vertical;font-family:monospace;font-size:12.5px}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:70px}
.thumb img{width:70px;height:100px;object-fit:cover;border-radius:8px;border:1px solid #403b31}
.thumb button{position:absolute;top:-6px;right:-6px;background:#a33;color:#fff;border:0;width:22px;height:22px;
  border-radius:50%;font-size:12px;line-height:1;padding:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex-shrink:0}

/* ---------- modal / lightbox ---------- */
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:15px;z-index:60}
.modal.show{display:flex}
.modal-box{background:#20201c;border:1px solid #5b4b36;border-radius:15px;padding:22px;width:100%;max-width:400px}
.modal-box h3{margin:0 0 6px}
.modal-box p{font-size:13px;color:var(--muted);margin:0 0 10px}
.modal-box input{width:100%;padding:12px;background:#111;color:#fff;border:1px solid #555;border-radius:8px;margin-bottom:12px;outline:none}
.err{color:#ff9999;font-size:12px;margin:8px 0 0;min-height:18px}
.lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:70;padding:20px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}

/* ---------- AI assistant ---------- */
.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;border:0;
  background:linear-gradient(140deg,#eab16e,#c98c47);color:#24190f;font-size:26px;z-index:50;
  box-shadow:0 8px 24px #0009;transition:.2s}
.fab:hover{transform:scale(1.08)}
.ai-panel{position:fixed;right:18px;bottom:86px;width:370px;max-width:calc(100vw - 24px);height:520px;max-height:calc(100vh - 120px);
  background:#181815;border:1px solid #4a4136;border-radius:16px;display:none;flex-direction:column;overflow:hidden;z-index:55;
  box-shadow:0 16px 50px #000b}
.ai-panel.show{display:flex}
.ai-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#22201b;border-bottom:1px solid #3b3932}
.ai-head b{font-size:14px;color:var(--gold)}
.ai-head small{display:block;font-size:10.5px;color:var(--muted)}
.ai-head button{background:transparent;border:0;color:#ccc;font-size:16px;padding:4px 8px}
.ai-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13px;white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere}
.msg.bot{background:#26241f;border:1px solid #3f3a31;align-self:flex-start;border-bottom-left-radius:3px}
.msg.user{background:#4a3a26;color:#ffe8cd;align-self:flex-end;border-bottom-right-radius:3px}
.ai-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.ai-chips button{background:#2b2923;border:1px solid #4a4338;color:#e6c9a4;font-size:11px;padding:5px 10px;border-radius:20px}
.ai-chips button:hover{background:#3a352c}
.ai-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #3b3932;background:#22201b}
.ai-input input{flex:1;padding:10px 12px;border-radius:20px;border:1px solid #4a4338;background:#111;color:#fff;outline:none;font-size:13px}
.ai-input input:focus{border-color:var(--gold)}
.ai-input button{border-radius:50%;width:40px;height:40px;border:0;background:var(--gold);color:#24190f;font-size:15px}
.ai-set{padding:10px 12px;background:#1f1d18;border-top:1px solid #3b3932;display:none}
.ai-set.show{display:block}
.ai-set input{width:100%;padding:8px 10px;background:#111;color:#fff;border:1px solid #4a4338;border-radius:8px;font-size:12px;margin-bottom:6px;outline:none}
.ai-set small{font-size:10.5px;color:var(--muted);display:block;margin-bottom:6px}

.help{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px}
.help a{color:var(--gold)}

@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .lesson-list{grid-template-columns:repeat(2,1fr);max-height:300px}
  .hero-cards{display:none}
}
@media(max-width:520px){
  .wrap{padding:10px}
  .brand{font-size:19px}
  .search{order:3;flex-basis:100%}
  .hero{padding:20px}
  .main{padding:15px}
  .lesson-list{grid-template-columns:1fr}
  h2{font-size:20px}
  .ai-panel{right:8px;left:8px;width:auto;bottom:80px;height:70vh}
  .fab{right:14px;bottom:14px}
}

/* ---------- LearnWell 2026 refresh ---------- */
:root{--gold:#f2bd78;--gold2:#ffe0b4;--bg:#0c1018;--panel:#141b27;--panel2:#1b2635;--line:#2d3a4d}
body{background:radial-gradient(ellipse at 12% 0%,#1d2b3e 0%,#0c1018 48%);color:#f6f2eb}
.brand{letter-spacing:.4px}
.hero{background:linear-gradient(120deg,#8b552c,#43304a 60%,#1c3850);box-shadow:0 18px 40px #0005}
.side,.main,.admin-card{background:rgba(20,27,39,.96);border-color:#2d3a4d}
.side{box-shadow:0 12px 30px #0003}
.side-pages{display:grid;gap:7px;margin:0 0 15px}
.side-pages button{width:100%;text-align:left;background:#1b2635;color:#e8e1d7;border:1px solid #33445a;border-radius:10px;padding:10px 12px;font-weight:700}
.side-pages button:hover,.side-pages button.active{background:linear-gradient(100deg,#4b3828,#263c52);border-color:#c08b52;color:#ffe0b4}
.side-pages .tiny{font-size:10px;color:#aeb9c8;display:block;font-weight:400}
.admin-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.editor-grid .wide{grid-column:1/-1}
.editor-grid input,.editor-grid textarea,.lab textarea,.lab input{width:100%;background:#0c121c;color:#fff;border:1px solid #3a4a60;border-radius:10px;padding:11px;outline:none}
.editor-grid textarea{min-height:100px;resize:vertical}
.editor-grid label,.lab label{display:block;color:#c5cbd4;font-size:12px;margin:0 0 6px}
.editor-grid input:focus,.editor-grid textarea:focus,.lab textarea:focus{border-color:var(--gold)}
.lesson-editor-card{border:1px solid #344258;border-radius:14px;padding:16px;background:linear-gradient(145deg,#182334,#121923);margin:12px 0}
.lesson-editor-card h3{margin:0 0 10px;color:#ffd49e}
.lab{background:linear-gradient(145deg,#172337,#121923);border:1px solid #344258;border-radius:16px;padding:18px;margin:14px 0}
.lab textarea{min-height:150px;resize:vertical}
.lab-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.lab-preview img{width:100%;max-height:240px;object-fit:contain;background:#080b10;border-radius:10px;border:1px solid #344258}
.ai-panel{background:#111a28;border-color:#42516a}
.ai-head{background:#1a2738}
@media(max-width:700px){.editor-grid{grid-template-columns:1fr}.editor-grid .wide{grid-column:auto}.side-pages{grid-template-columns:1fr 1fr}.side{position:relative;top:auto}}

</style>
 </head>
 <body>
  <div class="wrap">
   <header>
    <div class="brand">LearnWell.</div>
    <input class="search" id="search" placeholder="🔎 သင်ခန်းစာရှာရန်..." oninput="searchLessons(this.value)">
    <button class="btn" onclick="location.hash='#/lab'">🧪 လက်တွေ့</button>
    <button class="btn" id="adminBtn" onclick="adminAction()">Admin ဝင်ရန်</button>
   </header>
   <div id="view"></div>
   <div class="help">
    အကူအညီလိုပါက <a href="https://t.me/zypher998" target="_blank" rel="noopener">@zypher998</a> ကို ဆက်သွယ်ပါ။
   </div>
  </div>
  <!-- ================= AI ASSISTANT ================= -->
  <button class="fab" id="aiFab" onclick="toggleAI()">🤖</button>
  <div class="ai-panel" id="aiPanel">
   <div class="ai-head">
    <div>
     <b>🤖 LearnWell AI</b> <small>Prompt ပြင် · ပြဿနာ ဖြေရှင်း</small>
    </div>

     <button onclick="toggleAISet()" title="Settings">⚙</button>

   </div>

    <button class="btn gold" style="font-size:12px;padding:7px 12px" onclick="saveAISet()">သိမ်းမယ်</button>

    <button onclick="quickAsk('Prompt ရေးနည်')">Prompt ရေးနည်</button>
    <button onclick="quickAsk('Scene ခွဲနည်')">Scene ခွဲနည်</button>
   </div>
   <form class="ai-input" onsubmit="sendAI(event)">
    <input id="aiInput" placeholder="မေးခွန်း ရေးပါ..." autocomplete="off">
    <button type="submit">➤</button>
   </form>
  </div>
  <!-- ================= MODAL ================= -->
  <div class="modal" id="modal">
   <div class="modal-box">
    <h3>🔐 Admin Login</h3>
    <p>Admin Password ထည့်ပါ။</p>
    <input id="adminPass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="row">
     <button class="btn gold" onclick="doLogin()">ဝင်မယ်</button>
     <button class="btn" onclick="closeModal()">ပိတ်မယ်</button>
    </div>
    <p class="err" id="adminError"></p>
   </div>
  </div>
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
   <img id="lightboxImg" src="" alt="">
  </div>
  <script>
/* ==========================================================
   1) DATA
   ========================================================== */
const ADMIN_PASSWORD = "admin123";   // ⚠️ client-side only — Firebase ချိတ်ပြီးရင် ဖယ်ပါ

let lessons = [
{

"ပြီးသွားရင် နောက်အဆင့်ကို ဖွင့်ပေးပါမယ်။"
],
example:"ဒီသင်တန်းပြီးဆုံးရင် ကိုယ်ပိုင် AI ဇာတ်လမ်းတိုတစ်ခုကို စီစဉ်၊ ပုံဖန်တီး၊ Video ထုတ်ပြီး တည်းဖြတ်နိုင်ဖို့ ရည်ရွယ်ပါတယ်။",

},
{

/* ==========================================================
   2) STATE  (Firebase ချိတ်ရင် ဒီနေရာကို အစားထိုးပါ)
   ========================================================== */

const LESSONS_KEY = "lw_lessons_v4";
try {
  const savedLessons = JSON.parse(localStorage.getItem(LESSONS_KEY) || "null");
  if (Array.isArray(savedLessons) && savedLessons.length) lessons = savedLessons;
} catch(e) {}

const KEY = { done:"lw_done_v3", media:"lw_media_v3", admin:"lw_admin_v3", aiKey:"lw_aikey_v3", aiModel:"lw_aimodel_v3" };

const state = {
  done:  safeParse(localStorage.getItem(KEY.done), []),
  media: safeParse(localStorage.getItem(KEY.media), {}),
  isAdmin: sessionStorage.getItem(KEY.admin) === "1"
};

function safeParse(v, fb){ try{ return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }

function saveDone(){
  localStorage.setItem(KEY.done, JSON.stringify(state.done));
}
function getMedia(i){
  const m = state.media[i] || {};
  return { videos: m.videos || [], images: m.images || [] };
}
function saveMedia(){
  try{ localStorage.setItem(KEY.media, JSON.stringify(state.media)); return true; }
  catch(e){ return false; }
}
function isUnlocked(i){ return i === 0 || state.done.includes(i-1); }
function progressPct(){ return Math.round(state.done.length / lessons.length * 100); }

/* ==========================================================
   3) ROUTER  —  သင်ခန်းစာနှိပ်ရင် စာမျက်နှာအသစ် (hash route)
   ========================================================== */
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function render(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [route, param] = raw.split("/");

  if(route === "lesson"){
    renderLesson(parseInt(param, 10));
  } else if(route === "admin"){
    if(!state.isAdmin){ openModal(); location.hash = "#/"; return; }
    renderAdmin();
  } else {
    renderHome();
  }
  window.scrollTo(0, 0);
  document.getElementById("adminBtn").textContent = state.isAdmin ? "🛠 Admin Panel" : "Admin ဝင်ရန်";
}

function lessonBtnHTML(l, i, active){
  const done = state.done.includes(i);
  const open = isUnlocked(i);
  const cls = "lesson-btn" + (i===active?" active":"") + (done?" done":"") + (open?"":" locked");
  const inner = `<span class="num">${done?"✓":i+1}</span>
    <span><strong>${esc(l.title)}</strong>
    <small>${!open ? "🔒 ပိတ်ထားသည်" : (done ? "ပြီးစီး ✓" : "လေ့လာရန်")}</small></span>`;
  if(!open) return `<div class="${cls}" data-title="${esc(l.title.toLowerCase())}">${inner}</div>`;
  return `<a class="${cls}" href="#/lesson/${i}" data-title="${esc(l.title.toLowerCase())}">${inner}</a>`;
}

function renderLesson(i){
  const l = lessons[i];
  if(!l){ location.hash = "#/"; return; }

  if(!isUnlocked(i)){
    view().innerHTML = `
      <div class="layout">
        ${sidebarHTML(-1)}
        <main class="main">
          <div class="empty">
            <div style="font-size:60px">🔒</div>

            <p>အရင်အဆင့်ကို အရင်ပြီးဆုံးအောင် လုပ်ပါ။</p>
            <a class="btn gold" href="#/lesson/0" style="margin-top:14px;display:inline-block">အစမှ စမယ်</a>
          </div>
        </main>
      </div>`;
    bindSearch();
    return;
  }

  const m = getMedia(i);
  const done = state.done.includes(i);
  const isLast = i === lessons.length - 1;

  const videoBlock = m.videos.length
    ? m.videos.map(v=>`<div style="margin-bottom:14px">${videoHTML(v)}</div>`).join("")

function nextUnfinished(){
  for(let i=0;i<lessons.length;i++){ if(!state.done.includes(i)) return i; }
  return lessons.length-1;
}

function completeLesson(i){
  const chk = document.getElementById("taskCheck");
  if(!chk || !chk.checked){
    alert("လက်တွေ့လုပ်ပြီးကြောင်း အမှန်ခြစ်ပေးပါ။");
    return;
  }
  if(!state.done.includes(i)){
    state.done.push(i);
    saveDone();
  }
  if(i < lessons.length-1){
    location.hash = "#/lesson/" + (i+1);
  }else{
    view().innerHTML = `<div class="empty" style="padding:80px 10px">
      <div style="font-size:70px">🏆</div>
      <h2>သင်တန်းပြီးဆုံးပါပြီ!</h2>
      <p>ဂုဏ်ယူပါတယ်။ ကိုယ်ပိုင် AI Video Project ကို ဖန်တီးပြီးပါပြီ။</p>
      <a class="btn gold" href="#/" style="margin-top:16px;display:inline-block">Dashboard သို့</a>
    </div>`;
  }
}

function copyPrompt(){
  const t = document.getElementById("promptText")?.innerText || "";
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t)
      .then(()=>alert("Prompt ကူးယူပြီးပါပြီ။"))
      .catch(()=>fallbackCopy(t));
  }else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement("textarea");
  ta.value = t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); alert("Prompt ကူးယူပြီးပါပြီ။"); }
  catch(e){ alert(t); }
  document.body.removeChild(ta);
}

/* ---------- search ---------- */
function bindSearch(){
  const el = document.getElementById("search");
  if(el && el.value) searchLessons(el.value);
}
function searchLessons(q){
  const k = (q||"").toLowerCase().trim();
  document.querySelectorAll("#lessonList [data-title]").forEach(el=>{
    const hit = !k || el.dataset.title.includes(k);
    el.style.display = hit ? "" : "none";
  });
}

async function uploadImages(ev, i){
  const files = Array.from(ev.target.files || []);
  ev.target.value = "";
  if(!files.length) return;

  const before = JSON.stringify(state.media);
  const m = getMedia(i);

  for(const f of files){
    if(!f.type.startsWith("image/")) continue;
    try{ m.images.push(await compressImage(f)); }
    catch(e){ console.warn("compress failed", e); }
  }

  state.media[i] = m;
  if(!saveMedia()){
    state.media = safeParse(before, {});
    saveMedia();
    alert("သိမ်းရန် နေရာ မလုံလောက်ပါ။ ပုံအရေအတွက် လျှော့ပြီး ပြန်စမ်းပါ။");
  }
  renderAdmin();
}

/* ပုံကို ချုံ့ပြီး dataURL အဖြစ် ပြောင်း (localStorage သက်သာအောင်) */
function compressImage(file, maxW = 1000, quality = 0.72){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      try{
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement("canvas");
        c.width  = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", quality));
      }catch(e){ reject(e); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("image load error")); };
    img.src = url;
  });
}

/* ---------- video embed helper ---------- */
function videoHTML(url){
  if(!url) return "";
  let id = "";
  if(url.includes("youtube.com/watch?v=")) id = url.split("v=")[1].split("&")[0];
  else if(url.includes("youtu.be/")) id = url.split("youtu.be/")[1].split("?")[0];
  else if(url.includes("youtube.com/shorts/")) id = url.split("shorts/")[1].split("?")[0];
  else if(url.includes("youtube.com/embed/")) id = url.split("embed/")[1].split("?")[0];

  if(id) return `<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe>`;
  if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)) return `<video src="${url}" controls preload="metadata"></video>`;
  return `<a href="${url}" target="_blank" rel="noopener">Video ကြည့်ရန် ↗</a>`;
}

async function askGemini(q, key){
  const model = localStorage.getItem(KEY.aiModel) || "gemini-2.0-flash";
  const sys = `You are LearnWell AI, a capable Burmese-first creative and technical assistant for AI video makers.
Help with broad questions, story ideas, complete scripts, scene breakdowns, image prompts, image-to-video prompts, character consistency, Burmese dialogue and lip-sync, editing, troubleshooting, and HTML/CSS/JavaScript code.
Rules:
- Reply in clear, friendly Burmese. Explain technical English words in Burmese when useful.
- Give practical, detailed steps suitable for a learner. Do not pretend a tool can do something it cannot.
- For video failures, diagnose likely causes and provide a corrected short prompt plus settings/checklist.
- When writing prompts, provide a clean copy-ready English prompt separately from Burmese explanation.
- Preserve the user's exact Burmese dialogue unless asked to rewrite it.
- Use generic character labels (boy, girl, mother, father) in visual prompt descriptions; names may remain inside quoted dialogue.
- For consistent characters, instruct the user to attach the same reference image and preserve face, hair, age and clothes.
- For code requests, provide complete working HTML when feasible and do not remove unrelated existing features.
- If information is missing, ask one focused question instead of guessing.`;
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        contents:[{ role:"user", parts:[{ text: sys + "\n\nUser question: " + q }] }],
        generationConfig:{ temperature:0.75, maxOutputTokens:2200 }
      })
    }
  );
  if(!res.ok) throw new Error("API " + res.status);
  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text).join("\n").trim();
  if(!text) throw new Error("empty");
  return text;
}
